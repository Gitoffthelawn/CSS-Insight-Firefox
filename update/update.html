<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="updatepagetitle"></title>
  <link rel="stylesheet" href="./update.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../images/icon-512.png" alt="" data-i18n-alt="updatelogoalt" class="logo">
      <div>
        <h1>CSS Insight</h1>
        <h2><span data-i18n="updateversion"></span> <span id="version"></span></h2>
      </div>
    </header>

    <main>
      <section>
        <h3 data-i18n="updatenewfeatures"></h3>
        <ul>
          <li data-i18n="updatefeaturelocales"></li>
          <li data-i18n="updatefeaturetarget"></li>
          <li data-i18n="updatefeaturepreview"></li>
          <li data-i18n="updatefeatureaccessibility"></li>
        </ul>
      </section>

      <section>
        <h3 data-i18n="updateusagetips"></h3>
        <p data-i18n="updatetippicker"></p>
        <p data-i18n="updatetiprule"></p>
      </section>

      <section>
        <h3 data-i18n="updatesupport"></h3>
        <p><span data-i18n="updatesupportprompt"></span> <a href="https://addons.mozilla.org/firefox/addon/css-insight/" target="_blank" rel="noopener noreferrer" data-i18n="updatereview"></a>.</p>
        <p><span data-i18n="updatefeedbackprompt"></span> <a href="mailto:markalexi@proton.me">markalexi@proton.me</a>.</p>
      </section>

      <section>
        <h3 data-i18n="updatemoretools"></h3>
        <p><span data-i18n="updatefocusprompt"></span> <a href="https://blockdistraction.com/" target="_blank" rel="noopener noreferrer">BlockDistraction</a>.</p>
        <p><span data-i18n="updatetoolsprompt"></span> <a href="https://markalexi.com/" target="_blank" rel="noopener noreferrer">MarkAlexI</a>.</p>
      </section>
    </main>

    <footer>
      <button id="close-btn" type="button" data-i18n="close"></button>
    </footer>
  </div>
  <script src="./update.js"></script>
</body>
</html>
