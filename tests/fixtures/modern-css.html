<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Insight modern CSS fixture</title>
  <style id="modern-css-fixture">
    @layer components {
      .shell {
        container-type: inline-size;

        & > .card {
          display: block;
          padding: 1rem;
        }

        @media (width > 20rem) {
          & > .card {
            display: grid;
          }
        }
      }

      @supports (display: grid) {
        .card {
          gap: .5rem;
        }
      }

      @container (width > 1px) {
        .card {
          border: 1px solid currentColor;
        }
      }

      @scope (.scope) {
        .card {
          color: rebeccapurple;
        }
      }

      @keyframes fixture-fade {
        from { opacity: .5; }
        to { opacity: 1; }
      }
    }

    .other,
    .unrelated {
      outline: 2px solid red;
    }
  </style>
</head>
<body>
  <main class="scope shell">
    <article class="card">Inspect this card with CSS Insight.</article>
  </main>
  <section id="component-fixture"></section>
  <iframe id="frame-fixture" title="CSS Insight iframe fixture"></iframe>
  <script>
    const constructedSheet = new CSSStyleSheet();
    constructedSheet.replaceSync(`
      @media (width > 20rem) {
        .card:hover::before { content: "adopted"; }
      }
      @keyframes adopted-fade {
        from { transform: scale(.98); }
        to { transform: scale(1); }
      }
    `);
    document.adoptedStyleSheets = [
      ...document.adoptedStyleSheets,
      constructedSheet
    ];

    const componentHost = document.getElementById('component-fixture');
    const componentRoot = componentHost.attachShadow({ mode: 'open' });
    const componentStyle = document.createElement('style');
    componentStyle.textContent = `
      .shadow-card {
        color: darkgreen;
      }
      @media (width > 20rem) {
        .shadow-card:hover::before { content: "shadow"; }
      }
      @keyframes shadow-fade {
        from { opacity: .75; }
        to { opacity: 1; }
      }
    `;
    const shadowCard = document.createElement('button');
    shadowCard.className = 'shadow-card';
    shadowCard.textContent = 'Inspect this open shadow-root element.';
    componentRoot.append(componentStyle, shadowCard);

    document.getElementById('frame-fixture').srcdoc = `
      <!doctype html>
      <html lang="en">
        <head>
          <style>
            .frame-card { color: darkblue; }
            @media (width > 10rem) { .frame-card { display: grid; } }
            @keyframes frame-fade { from { opacity: .8; } to { opacity: 1; } }
          </style>
        </head>
        <body><button class="frame-card">Inspect this iframe element.</button></body>
      </html>
    `;
  </script>
</body>
</html>
