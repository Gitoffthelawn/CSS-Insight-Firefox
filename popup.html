<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="defaulttitle"></title>
  <link rel="stylesheet" href="styles/popup.css">
  <link rel="stylesheet" href="styles/atom-one-light.min.css" type="text/css" media="all" />
</head>

<body>
  <div class="container">
    <h2 data-i18n="mainheader"></h2>
    
    <p id="statusMessage" class="status hidden" role="status" aria-live="polite"></p>

    <button type="button" id="trackTagBtn" data-i18n="tracktagstart" class="track" data-page-action></button>
    
    <label for="tagInput" data-i18n="taginputlabel"></label>
    <input type="text" id="tagInput" data-i18n-placeholder="taginputplaceholder">
    <button type="button" id="declaredStylesBtn" data-i18n="declaredstyles" data-page-action></button>
    <button type="button" id="computedStylesBtn" data-i18n="computedstyles" data-page-action></button>
    <button type="button" id="mediaRulesBtn" data-i18n="mediarules" data-page-action></button>
    <button type="button" id="keyframesRulesBtn" data-i18n="keyframesrules" data-page-action></button>
    
    <div id="cssInfo" class="hidden">
      <h3 data-i18n="infoheader"></h3>
      <div class="controls">
        <button type="button" id="hideCssInfo" class="hideBtn" data-i18n-aria-label="close">×</button>
        <button type="button" id="saveBtn" data-i18n="savetofile"></button>
      </div>
      <div>
        <pre class="output">
          <code
            class="language-css"
            id="styleData"></code>
        </pre>
      </div>
      <button type="button" id="copyBtn" data-i18n="copytext"></button>
    </div>
    
    <button type="button" id="moreDetailsBtn" class="hidden" data-i18n="moredetails" data-page-action></button>
    
    <button type="button" id="applyRuleBtn" data-i18n="applyrule" class="apply"></button>
    <div id="newRule" class="hidden">
      <h3 id="newRuleHeader" data-i18n="newruleheader"></h3>
      <button type="button" id="hideNewRule" class="hideBtn" data-i18n-aria-label="close">×</button>
      <textarea id="newRuleData" aria-labelledby="newRuleHeader"></textarea>
      <button type="button" id="injectCSSBtn" data-i18n="injectcss" class="apply" data-page-action></button>
    </div>
  </div>

  <script type="module" src="scripts/i18n.js"></script>
  <script type="module" src="popup.js"></script>

  <script src="scripts/highlight.min.js"></script>
</body>

</html>
